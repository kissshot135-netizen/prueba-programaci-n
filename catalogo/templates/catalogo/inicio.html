<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ferretería El Constructor</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .catalogo {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .producto {
            background-color: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .producto h2 {
            font-size: 20px;
            color: #1f2937;
        }

        .categoria {
            color: #666;
        }

        .precio {
            color: #dc2626;
            font-size: 22px;
            font-weight: bold;
        }

        .stock {
            color: #15803d;
        }
    </style>
</head>

<body>

    <header>
        <h1>Ferretería El Constructor</h1>
        <p>Todo lo que necesitas para tus proyectos</p>
    </header>

    <main class="catalogo">

        {% for producto in productos %}

        <article class="producto">

            <h2>{{ producto.nombre }}</h2>

            <p class="categoria">
                Categoría: {{ producto.categoria }}
            </p>

            <p class="precio">
                ${{ producto.precio }}
            </p>

            <p class="stock">
                Stock disponible: {{ producto.stock }}
            </p>

        </article>

        {% endfor %}

    </main>

</body>
</html>
